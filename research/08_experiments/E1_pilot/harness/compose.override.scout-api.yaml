# Paths are absolute env substitutions: independent of Compose's first-file directory.
services:
  sut-scout-api:
    # Fixed tag: built once, reused by every run so image IDs stay comparable.
    image: r1-scout-sut:pilot
    build:
      context: ${EMB_DIR:?Set EMB_DIR}
      dockerfile: dockerfiles/scout-api.dockerfile
  mitmproxy:
    user: "${PILOT_UID:?Set PILOT_UID}:${PILOT_GID:?Set PILOT_GID}"
    environment:
      MITM_LOG_DIR: /custom-logs
      MITM_FULLLOG_FILE: exchanges.jsonl
      MITM_MAX_BODY: ${MITM_MAX_BODY:-65536}
    # The image entrypoint runs usermod, which fails for a non-root user; call mitmdump directly.
    entrypoint: ["mitmdump"]
    command:
      - --mode
      - reverse:http://sut-scout-api:8080
      - --listen-host
      - 0.0.0.0
      - --listen-port
      - "8080"
      - --set
      - keep_host_header=true
      - --set
      - confdir=/tmp/mitmproxy
      - -s
      - /addons/mitm_fulllog.py
    volumes:
      - ${PILOT_LOG_DIR:?Set PILOT_LOG_DIR}:/custom-logs
      - ${TOOLS_DIR:?Set TOOLS_DIR}:/addons:ro
